<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liron Markovich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="gate-body">
  <header class="site-header" style="background:transparent;">
    <span class="logo">Liron Markovich</span>
  </header>
  <main class="gate-main">
    <svg class="gate-lock" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M17 24V17a11 11 0 0 1 22 0v7" stroke="#fff" stroke-width="4" fill="none"/>
      <rect x="10" y="24" width="36" height="26" rx="6" fill="#822149"/>
      <circle cx="28" cy="37" r="3" fill="#182B24"/>
    </svg>
    <h1>This portfolio is by invitation.</h1>
    <p class="lede">You've got the password, or you know where to find it. Either way, you're in the right place.</p>
    <form class="gate-form" id="gate-form">
      <label class="visually-hidden" for="gate-input">Password</label>
      <div class="gate-input-wrap">
        <input type="password" id="gate-input" placeholder="Enter password" autocomplete="off" required>
        <button type="button" class="gate-eye" id="gate-eye" aria-label="Show password" aria-pressed="false">
          <svg id="gate-eye-open" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 10s3.2-6 9-6 9 6 9 6-3.2 6-9 6-9-6-9-6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="10" cy="10" r="2.6" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          <svg id="gate-eye-closed" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none;">
            <path d="M2.5 2.5l15 15M8.3 8.5a2.6 2.6 0 0 0 3.7 3.6M6.2 5.1C3.2 6.4 1 10 1 10s3.2 6 9 6c1.5 0 2.8-.4 3.9-1M15.8 14C17.8 12.5 19 10 19 10s-3.2-6-9-6c-.6 0-1.2.05-1.7.15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <button type="submit" class="btn btn-primary">Unlock</button>
    </form>
    <p class="gate-error" id="gate-error">That password didn't work &mdash; try again.</p>
    <a class="gate-fallback" href="mailto:lironmarko@gmail.com?subject=Portfolio%20password">Don't have a password? Email me and I'll send one over.</a>
  </main>
  <script src="js/gate.js"></script>
</body>
</html>
